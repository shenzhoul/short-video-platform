# =============================================================================
# Host nginx on douyin-prod-01. The ONLY public entrypoint. TLS terminates here.
# =============================================================================
# There is no purchased domain yet, so hostnames come from sslip.io, which
# resolves `<anything>.<IPv4-with-dashes-or-dots>.sslip.io` to that IPv4 with no
# account, no record and no cost. That is enough for Let's Encrypt HTTP-01,
# which is what makes real HTTPS possible today.
#
# INSTALL — CERTIFICATES FIRST, then this config. The order is not negotiable:
# the 443 blocks below name certificate files, so installing this before they
# exist makes `nginx -t` fail on a missing file.
#
#   export VM_IP=203.0.113.45
#
#   # 1. Obtain the cert using the DEFAULT nginx site, which already serves
#   #    /var/www/html on :80. `certonly` rather than `--nginx`, so certbot
#   #    does not rewrite this file and silently drop the WebSocket upgrade
#   #    and TUS buffering directives it knows nothing about.
#   sudo certbot certonly --webroot -w /var/www/html \
#     -d api.${VM_IP}.sslip.io -d files.${VM_IP}.sslip.io
#
#   # 2. Then install this config and retire the default site.
#   sed "s/__VM_IP__/${VM_IP}/g" deploy/nginx/douyin-clone.conf \
#     | sudo tee /etc/nginx/sites-available/douyin-clone >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/douyin-clone /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Renewal keeps working because the :80 block below still serves
# /.well-known/acme-challenge/ from the same webroot.
#
# Moving to a real domain later is a `server_name` change plus a fresh certbot
# run — nothing else in this file, and nothing in the application, depends on
# the hostname shape.
#
# WHAT IS NOT HERE, deliberately:
#   - nothing: all four applications are proxied from here. The two web apps
#     were originally going to be hosted externally; they are now containers on
#     this box like the API and the file server, on loopback ports.
#   - media: served by the Cloudflare Worker straight from R2. Proxying video
#     through here would spend the VM's egress on every seek, and GCE egress is
#     the one line item on this deployment that is metered.

# `$connection_upgrade` is NOT a built-in variable. Without this map it expands
# to the empty string, `Connection:` is sent empty, and the WebSocket upgrade
# never happens — Socket.IO silently falls back to long-polling, which works
# well enough in a quick test that the misconfiguration is easy to ship.
#
# It belongs in the `http` context; sites-enabled is inside `http`, so declaring
# it here is correct. If nginx.conf already declares it, delete one — a
# duplicate is a startup error.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------ redirects
server {
    listen 80;
    listen [::]:80;
    server_name api.__VM_IP__.sslip.io files.__VM_IP__.sslip.io
                app.__VM_IP__.sslip.io admin.__VM_IP__.sslip.io;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP, including
    # at every renewal.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# Anything arriving on this IP that is not one of our hostnames — a scanner
# hitting the bare address, a stale DNS entry — gets closed rather than served
# by whichever server block happens to be first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ------------------------------------------------------------------------ API
server {
    # `listen ... http2` rather than the newer standalone `http2 on;`
    # directive: that one landed in nginx 1.25.1 and Ubuntu 24.04 LTS ships
    # 1.24.0, where it is an unknown directive and `nginx -t` fails outright.
    # This form works on both — 1.25+ accepts it with a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.__VM_IP__.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/api.__VM_IP__.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__VM_IP__.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # NOTE: no HSTS while on sslip.io. `max-age` would be cached by browsers
    # against the *sslip.io* name, and the header is inherited by every other
    # subdomain of it — a domain shared with strangers. Add HSTS when a real
    # domain replaces this.
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # JSON bodies only. File bytes go to the files. host, so this stays small —
    # it is also a cheap cap on an accidental large POST at the API.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # `proxy_add_x_forwarded_for` APPENDS the real socket peer to whatever
        # the client sent, which is why `getTrustedClientIp` takes the
        # RIGHT-MOST entry: a client can prepend a forged address, but it cannot
        # append past nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # Socket.IO upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A websocket idle between events must not be culled at the default 60s,
        # or every client reconnects on a loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Unauthenticated, and readiness names failing dependencies. For the
    # operator on the box, not the internet.
    location /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}

# ---------------------------------------------------------------- file server
server {
    # `listen ... http2` rather than the newer standalone `http2 on;`
    # directive: that one landed in nginx 1.25.1 and Ubuntu 24.04 LTS ships
    # 1.24.0, where it is an unknown directive and `nginx -t` fails outright.
    # This form works on both — 1.25+ accepts it with a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.__VM_IP__.sslip.io;

    # Deliberately the api.* path. `certbot -d api.… -d files.…` issues ONE
    # SAN certificate covering both names, stored under a directory named after
    # the FIRST -d argument. There is no files.* directory and there never will
    # be, so pointing at one makes `nginx -t` fail with a missing file.
    ssl_certificate     /etc/letsencrypt/live/api.__VM_IP__.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__VM_IP__.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # This host carries real upload bytes. Keep it at least as large as the
    # largest accepted upload, or nginx rejects with 413 before the app's own
    # size check runs — and the client gets nginx's HTML error page instead of
    # the app's stable error code.
    client_max_body_size 5g;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # TUS resumable uploads. Buffering must be off: with it on, nginx
        # accumulates the whole PATCH body on disk before forwarding, which
        # defeats resumability and doubles disk write per upload — on a 30 GB
        # disk that is not academic.
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The API reaches these over the docker network and never through nginx.
    # Nothing on the public internet has any business calling them.
    location /internal/ {
        deny all;
    }

    location /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

# ------------------------------------------------------------- user web app
# Next.js standalone server in a container, bound to 127.0.0.1:8081.
#
# This vhost serves HTML, the client bundle and static assets — nothing else.
# The browser talks to the API and to Socket.IO DIRECTLY at api.<ip>.sslip.io,
# because `NEXT_PUBLIC_API_ENDPOINT` is set and both `api-request.ts` and
# `socket-context.tsx` prefer it over the same-origin rewrite. That is
# deliberate: it keeps a real WebSocket upgrade on the API vhost (which has the
# `$connection_upgrade` map and the 3600s timeouts) instead of tunnelling
# realtime traffic through this one, and it is why CORS_ORIGIN must list this
# origin exactly.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.__VM_IP__.sslip.io;

    # One SAN certificate covers all four names and lives under the directory
    # named after certbot's FIRST -d argument. There is no app.* directory.
    ssl_certificate     /etc/letsencrypt/live/api.__VM_IP__.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__VM_IP__.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # No HSTS while on sslip.io — the header is inherited by every other
    # subdomain of a domain shared with strangers. Add it with a real domain.
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # Uploads do not pass through here: the browser asks the API for a target
    # and then posts bytes to files.<ip>.sslip.io directly.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # Next's own dev/HMR websocket is not used in production, but the
        # upgrade headers cost nothing and keep this block identical in shape
        # to the API's.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSR can legitimately take a few seconds on a cold container; the
        # default 60s is ample and left alone.
        proxy_read_timeout 60s;
    }

    # Immutable, content-hashed bundles. Next already sets the right
    # Cache-Control, so this only stops the proxy from second-guessing it.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
    }
}

# ------------------------------------------------------------ admin web app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.__VM_IP__.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/api.__VM_IP__.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__VM_IP__.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    # The admin app is not a public surface; keep it out of search results even
    # though every route already requires a session.
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }
}

# Same catch-all as port 80: an unrecognised Host on 443 is closed rather than
# falling through to the first server block.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/api.__VM_IP__.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__VM_IP__.sslip.io/privkey.pem;
    return 444;
}
